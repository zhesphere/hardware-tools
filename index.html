<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>硬件工程师工具箱</title>
  <link rel="icon" type="image/webp" href="favicon.webp">
  <link rel="apple-touch-icon" href="favicon.webp">
  <script>
    // ★ 必须在 CSS 之前执行，防止主题闪烁
    (function(){
      var t = localStorage.getItem('hw-tools-theme');
      document.documentElement.setAttribute('data-theme', t || 'dark');
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="index.html" aria-label="硬件工程师工具箱首页">
      <span class="brand-mark" aria-hidden="true">⌁</span>
      <span><strong>Hardware Tools</strong><small>电路计算工作台</small></span>
    </a>
    <div class="sidebar-title">计算工具</div>
    <ul class="tool-nav" id="toolNav">
      <li><button class="tool-btn" data-tool="unit-converter">⇄ 单位换算</button></li>
      <li><button class="tool-btn" data-tool="color-code">◉ 电阻色环</button></li>
      <li><button class="tool-btn" data-tool="ohms-law">Ω 欧姆定律</button></li>
      <li><button class="tool-btn" data-tool="led">◌ LED 限流</button></li>
      <li><button class="tool-btn" data-tool="voltage-divider">⌁ 分压计算</button></li>
      <li><button class="tool-btn" data-tool="inductor-buck">⎓ Buck 电感</button></li>
      <li><button class="tool-btn" data-tool="crystal-load">◇ 晶体负载</button></li>
    </ul>
    <div class="sidebar-footer">
      <span><i></i>仅在本地计算</span>
      <a href="https://github.com/zhesphere/hardware-tools" target="_blank" rel="noreferrer" class="github-link">查看源码</a>
    </div>
  </aside>

  <main class="main">
    <div class="main-shell">
      <header class="family-bar">
        <span class="family-name">Orbitvo Tools</span><span aria-hidden="true">/</span><span>硬件计算</span>
        <button class="theme-toggle" id="themeToggle" title="切换深色/浅色主题" aria-label="切换深色或浅色主题">◐</button>
      </header>
      <div class="main-content" id="mainContent"></div>
      <footer class="footer"><span>结果用于工程初算，请结合规格书与实测确认。</span><span>本地处理 · 无需登录</span></footer>
    </div>
  </main>
  </div>

  <script src="js/core/calculations.js?v=20260816"></script>
  <script src="js/app.js?v=20260816"></script>
  <script src="js/tools/unit-converter.js?v=20260816"></script>
  <script src="js/tools/resistor-color-code.js?v=20260816"></script>
  <script src="js/tools/ohms-law.js?v=20260816"></script>
  <script src="js/tools/led-resistor.js?v=20260816"></script>
  <script src="js/tools/voltage-divider.js?v=20260816"></script>
  <script src="js/tools/inductor-buck.js?v=20260816"></script>
  <script src="js/tools/crystal-load.js?v=20260816"></script>
</body>
</html>
